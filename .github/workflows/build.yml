name: Build SwitchBrowser NRO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf switch-freetype switch-libpng switch-libjpeg-turbo switch-zlib 2>/dev/null || \
        dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf 2>/dev/null || \
        dkp-pacman -Sy --noconfirm sdl2 sdl2_ttf 2>/dev/null || \
        echo "Trying with pre-installed packages"
    
    - name: List available packages
      run: |
        dkp-pacman -Q | grep -i sdl || true
        dkp-pacman -Q | grep -i ttf || true
        dkp-pacman -Q | grep -i freetype || true
    
    - name: Build
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITA64=$DEVKITPRO/devkitA64
        make -j$(nproc)
    
    - name: Upload NRO
      uses: actions/upload-artifact@v4
      with:
        name: SwitchBrowser-NRO
        path: SwitchBrowser.nro
        if-no-files-found: error
